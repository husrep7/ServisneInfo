version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: servisneinfo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: servisneinfo
      POSTGRES_PASSWORD: servisneinfo_pass
      POSTGRES_DB: servisneinfo_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: servisneinfo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
